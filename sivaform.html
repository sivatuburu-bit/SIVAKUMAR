<!DOCTYPE html>
<html>
    <head>
        <title>form design</title>
        <link rel="stylesheet" href="sivaform.css">
    </head>
    <body>
            <h1>Appllication for training</h1>

            <form>

            <label for="name">project</label>
            <input type="text" id="name" value="Aarohan" readonly>
            <br><br>

            <label for="name">name:-</label>
            <input type="text" id="name" placeholder="enter full name">
            <br><br>

            <label for="age">age:-</label>
            <input type="number" id="age" placeholder="enter age" max="45" min="18">
            <br><br>

            <label for="number">phone number:-</label>
            <input type="tel" id="number" placeholder="enter phone number" required="10">
            <br><br>

            <label for="email">email:-</label>
            <input type="email" id="email" placeholder="enter email" required>
            <br><br>

            <label for="dob">date of birth:-</label>
            <input type="date" id="dob" max="2008-01-01">
            <br><br>

            <label for="district">district:-</label>
            <select id="district">
                <option value="select">select</option>
                <option value="asr">ASR</option>
                <option value="vijayanagaram">Vijayawada</option>
                <option value="srikakulam">srikakulam</option>
                <option value="east godavari">East Godavari</option>
                <option value="west godavari">West Godavari</option>
                <option value="krishna">Krishna</option>
                <option value="guntur">Gunturu</option>
            </select>
            <br><br>

            <label for="mandal">mandal:-</label>
            <select id="mandal">
                <option value="select">select</option>
                <option value="hukumpeta">Hukumpeta</option>
                <option value="paderu">Paderu</option>
                <option value="araku">Araku</option>
                <option value="koyyuru>">Koyuru</option>

            </select>
            <br><br>

            <label for="address">address:-</label>
            <textarea id="address" rows="6" cols="30" placeholder="enter full address"></textarea>
            <br><br>

            <label for="test">Uname:-</label>
            <input type="text" id="test" name="username" required>
            <br><br>

            <label for="password">password:-</label>
            <input type="password" id="password" name="password" placeholder="enter password" required>
            <br><br>

            <label for="map">Upload:-</label>
            <input type="file" id="map" required>
            <br><br>

            <button type="submit">Submit</button>
            
            <button type="reset">Reset</button>
            

        </form>

    </body>

</html>
