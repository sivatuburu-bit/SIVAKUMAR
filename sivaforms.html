<!DOCTYPE html>
<html>
    <head>
        <title>application form</title>
    </head>
    <body>
        <Job application>
            <label for="name">project:-</label>
            <input type="text" id="name" value="Aarohan" readonly>

            <input type="text" id="name" placeholder="full name in capital letters">

            <input type="number" id="age" max="35">

            <input type="radio" id="female" name="skill" value="female">

            <br><br>

            <label for="number">mobile number:-</label>
            <input type="tel" id="number" maxlength="10" required>
            <br><br>

            <label for="email">email:-</label>
            <input type="email" id="email">
            <br><br>

            <label for="district">district:-</label>
            <select id="district">
                <option value="select">select</option>
                    <option value="asr">asr</option>

                    <option value="vizag">vizag</option>

                    <option value="paderu">paderu</option>
                    <option value="hukumpeta">hukumpeta</option>
                    <option value="araku">araku</option>

            </select>
            <br><br>
            
                <label for="mandal">mandal:-</label>
                <select id="mandal">
                    <option value="select">Select</option>
                    <option value="hukumpeta">Hukumpeta</option>
                    <option value="paderu">Paderuy</option>

                    <option value="munchegiputtu">munchegiputtu</option>
                    <option value="arakuvelly">Arakuvelly</option>
                    </select>
                    <br><br>
                
            </select>

            <label for="map">Upload Resume:-</label>
            <input type="file" id="map">
            <br><br>

            <label for="message">Message:-</label>
            <textarea id="message" rows="5" cols="25"></textarea>
            <br><br>

            <label for="test">Uname:-</label>
            <input type="text" id="test" name="username">
            <br><br>

            <label for="password">Password:-</label>
            <input type="password" id="password" name="password" required>

</html>
